name: Auto-publish posts

# Posts opened by the daily authoring routine (see thedtripp/hazel AUTHORING / skills/linkedin-posts)
# arrive as PRs labeled `auto-publish`. This workflow generates the title image, runs the site
# build as a gate, merges, and triggers the deploy. Pause it by setting the repo variable
# AUTO_PUBLISH to "false" (Settings > Secrets and variables > Actions > Variables).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'auto-publish') &&
      vars.AUTO_PUBLISH != 'false' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Only post files may change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bad=$(gh pr diff ${{ github.event.pull_request.number }} --name-only \
            | grep -v -E '^src/content/blog/[a-z0-9-]+\.md$|^src/assets/post-images/[a-z0-9-]+\.png$' || true)
          if [ -n "$bad" ]; then
            echo "Refusing to auto-publish; PR touches other files:"; echo "$bad"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Generate title images
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run post-image -- --all

      - name: Build (gate)
        run: npm run build

      - name: Commit generated images and front matter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --staged --quiet || git commit -m "Add title image"
          git push

      - name: Merge and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
          # A merge made with GITHUB_TOKEN does not trigger the push-based deploy, so start it.
          gh workflow run deploy.yml --ref main
