name: Auto-publish posts

# Posts opened by the daily authoring routine (see thedtripp/hazel AUTHORING / skills/linkedin-posts)
# arrive as PRs labeled `auto-publish`. This workflow generates the title image, runs the site
# build as a gate, merges, and triggers the deploy. Pause it by setting the repo variable
# AUTO_PUBLISH to "false" (Settings > Secrets and variables > Actions > Variables).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write
  actions: write

# One run at a time across all PRs, so each post's color is chosen after the previous post merged.
concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'auto-publish') &&
      vars.AUTO_PUBLISH != 'false' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Bring in the latest main (earlier posts' colors)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main

      - name: Only post files may change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bad=$(gh pr diff ${{ github.event.pull_request.number }} --name-only \
            | grep -v -E '^src/content/blog/[a-z0-9-]+\.md$|^src/assets/post-images/[a-z0-9-]+\.png$' || true)
          if [ -n "$bad" ]; then
            echo "Refusing to auto-publish; PR touches other files:"; echo "$bad"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Generate title images
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run post-image -- --all

      - name: Build (gate)
        run: npm run build

      - name: Commit generated images and front matter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --staged --quiet || git commit -m "Add title image"
          git push

      - name: Remove the AI attribution footer from the PR body
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The authoring routine's environment appends a "Generated by Claude Code" line with a session
          # link, and the squash merge below would copy it into the commit message on main.
          body="$(gh api "repos/$REPO/pulls/$PR" -q .body)"
          clean="$(printf '%s' "$body" | python3 -c "import re,sys; print(re.sub(r'[\r\n]*(?:---[ \t\r]*\n)?_?Generated (?:with|by) \[?Claude Code\]?[^\n]*\s*\$', '', sys.stdin.read()).rstrip())")"
          if [ "$clean" != "$body" ]; then
            gh api -X PATCH "repos/$REPO/pulls/$PR" -f body="$clean"
          fi

      - name: Merge and deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Use the API, not `gh pr merge`: that also tries to check out main locally and fails here.
          # Right after the image commit is pushed, GitHub may answer 405 "not mergeable" while it
          # recomputes mergeability, so retry for up to a minute.
          merged=0
          for i in 1 2 3 4 5 6; do
            sleep 10
            if gh api -X PUT "repos/$REPO/pulls/$PR/merge" -f merge_method=squash; then merged=1; break; fi
          done
          [ "$merged" = 1 ] || { echo "PR #$PR never became mergeable"; exit 1; }
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" || true
          # A merge made with GITHUB_TOKEN does not trigger the push-based deploy, so start it.
          gh workflow run deploy.yml -R "$REPO" --ref main
